name: Switch2Kit integration
on:
  pull_request:
  push:
    branches: [main, 'switch2kit/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switch2kit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize Delta dependencies and resolve the actual SDK package
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
          mkdir -p build
          xcodebuild -resolvePackageDependencies -workspace Delta.xcworkspace -scheme Switch2ControllerTests -clonedSourcePackagesDirPath build/SourcePackages > build/packages.log 2>&1
      - name: Exercise production controllers and lifecycle on iOS
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d,reverse=True) if "iOS" in runtime for x in d[runtime] if "iPhone" in x["name"]))')
          xcodebuild -workspace Delta.xcworkspace -scheme Switch2ControllerTests -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/controllers -clonedSourcePackagesDirPath build/SourcePackages -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO -resultBundlePath build/ControllerTests.xcresult ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test > build/controller-tests.log 2>&1
      - name: Build complete Simulator and device applications
        run: |
          xcodebuild -workspace Delta.xcworkspace -scheme Delta -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/app -clonedSourcePackagesDirPath build/SourcePackages -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build/simulator-app.log 2>&1
          xcodebuild -workspace Delta.xcworkspace -scheme Delta -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/app -clonedSourcePackagesDirPath build/SourcePackages -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build/device-app.log 2>&1
      - name: Verify source and dependency checkouts
        run: |
          # GLideN64's existing build phase regenerates its tracked version header.
          # Check every other source file and every submodule revision without restoring files.
          git diff --exit-code --ignore-submodules=dirty
          git submodule foreach --recursive '
            if test "$displaypath" = "Cores/N64DeltaCore/Mupen64Plus/GLideN64"; then
              git diff --exit-code -- . ":(exclude)src/Revision.h"
            else
              git diff --exit-code --ignore-submodules=dirty
            fi
          '
          for checkout in build/SourcePackages/checkouts/*; do git -C "$checkout" diff --exit-code; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controller-integration-results
          path: |
            build/*.log
            build/ControllerTests.xcresult
          if-no-files-found: warn
          retention-days: 3
